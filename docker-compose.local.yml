# AI Bridge local build-and-run stack (plain HTTP, no domain, no certificate).
#
#   ./deploy-local.sh        build the image and start everything
#   http://localhost:3000    open in the browser
#
# This file is independent from docker-compose.yml (production): it uses its own
# project name, image tag, volumes and .env.local, so both can coexist.

name: aibridge-local

services:
  new-api:
    image: aibridge-local:latest
    build:
      context: .
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${LOCAL_PORT:-3000}:3000"
    volumes:
      - ./data-local:/data
      - ./logs-local:/app/logs
    environment:
      SQL_DSN: "postgresql://root:${POSTGRES_PASSWORD:?Run deploy-local.sh to initialize .env.local}@postgres:5432/new-api"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Run deploy-local.sh to initialize .env.local}@redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?Run deploy-local.sh to initialize .env.local}"
      # Plain HTTP: the Secure cookie flag and strict origin guard are for HTTPS only.
      SESSION_COOKIE_SECURE: "false"
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: aibridge-local
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run deploy-local.sh to initialize .env.local}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run deploy-local.sh to initialize .env.local}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run deploy-local.sh to initialize .env.local}"
      POSTGRES_DB: new-api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
